# Apache reverse proxy for the public site.
#
# On WHM/cPanel this belongs in the userdata include directory, NOT in a vhost —
# WHM regenerates vhosts on any Apache rebuild and would discard it silently:
#
#   /etc/apache2/conf.d/userdata/std/2_4/<user>/<domain>/fantazia.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/<user>/<domain>/fantazia.conf
#   /scripts/ensure_vhost_includes --all-users && systemctl restart httpd
#
# Verify the paths against your cPanel version — WHM > Apache Configuration >
# Include Editor shows where it expects them.
#
# Replace <user> with the cPanel account name throughout.

# --- Media -------------------------------------------------------------------
# Uploads live inside public_html, so Apache already serves them and no Alias is
# needed. Node never sees an image request. Execution is disabled by the
# .htaccess in that directory — it is somewhere the public can write into
# through the upload form.
ProxyPass /media !

# --- Next.js build assets: static and immutable ------------------------------
Alias /_next/static /home/<user>/app/apps/web/.next/static
<Directory "/home/<user>/app/apps/web/.next/static">
    Require all granted
    Options -Indexes
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Directory>
ProxyPass /_next/static !

# --- Everything else goes to the Node process on localhost -------------------
ProxyPreserveHost On
ProxyTimeout 60
RequestHeader set X-Forwarded-Proto "https"

ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/

# The app sets its own application headers; these are the ones Apache owns.
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
