# Apache reverse proxy for the public site.
#
# On cPanel/WHM this belongs in the userdata include directory rather than in a
# vhost directly, so an Apache rebuild does not wipe it:
#
#   /etc/apache2/conf.d/userdata/std/2_4/<user>/<domain>/fantazia.conf
#   /etc/apache2/conf.d/userdata/ssl/2_4/<user>/<domain>/fantazia.conf
#   /scripts/ensure_vhost_includes --all-users && systemctl restart httpd
#
# Verify those paths against your cPanel version before relying on them.

# --- Media: served straight from disk. Node never sees these requests. ---
Alias /media /home/fantazia/media
<Directory "/home/fantazia/media">
    Require all granted
    Options -Indexes -ExecCGI
    AllowOverride None
    # Storage keys are unique per upload, so bytes at a URL never change.
    Header always set Cache-Control "public, max-age=31536000, immutable"
    Header always set X-Content-Type-Options "nosniff"
    # Refuse to execute anything that lands here, whatever its extension.
    php_admin_flag engine off
    RemoveHandler .php .phtml .php3 .php4 .php5 .php7 .php8 .cgi .pl
</Directory>

# --- Next.js build assets: also static, also immutable. ---
Alias /_next/static /home/fantazia/app/apps/web/.next/static
<Directory "/home/fantazia/app/apps/web/.next/static">
    Require all granted
    Options -Indexes
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# --- Everything else goes to the Node process on localhost. ---
ProxyPreserveHost On
ProxyTimeout 60
RequestHeader set X-Forwarded-Proto "https"

ProxyPass /media !
ProxyPass /_next/static !
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/

# The app sets its own security headers; these are the ones Apache should own.
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
