# Apache reverse proxy for the admin portal, on its own hostname.
#
# Same placement rule as the public site: userdata include directory, not a
# vhost. Replace <user> with the cPanel account name.
#
# The admin is a separate deployment precisely so it can be restricted at the
# edge without touching the public site.

Alias /_next/static /home/<user>/app/apps/admin/.next/static
<Directory "/home/<user>/app/apps/admin/.next/static">
    Require all granted
    Options -Indexes
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Directory>
ProxyPass /_next/static !

ProxyPreserveHost On
# Uploads are processed synchronously, so allow longer than the public site.
ProxyTimeout 120
RequestHeader set X-Forwarded-Proto "https"

ProxyPass / http://127.0.0.1:3001/
ProxyPassReverse / http://127.0.0.1:3001/

Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header always set X-Frame-Options "DENY"
Header always set X-Robots-Tag "noindex, nofollow"

# Uncomment once the office and VPN addresses are known. The portal holds guest
# data and integration credentials; there is no reason for it to answer the
# whole internet.
#
# <Location "/">
#     Require ip 197.0.0.0/24
#     Require ip 41.0.0.0/24
# </Location>
