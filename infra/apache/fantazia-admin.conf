# Apache reverse proxy for the admin portal, on its own hostname.
#
# The admin is deliberately a separate deployment so it can be restricted at
# the edge without touching the public site.

ProxyPreserveHost On
ProxyTimeout 120
RequestHeader set X-Forwarded-Proto "https"

Alias /_next/static /home/fantazia/app/apps/admin/.next/static
<Directory "/home/fantazia/app/apps/admin/.next/static">
    Require all granted
    Options -Indexes
    Header always set Cache-Control "public, max-age=31536000, immutable"
</Directory>

ProxyPass /_next/static !
ProxyPass / http://127.0.0.1:3001/
ProxyPassReverse / http://127.0.0.1:3001/

Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
Header always set X-Frame-Options "DENY"
Header always set X-Robots-Tag "noindex, nofollow"

# Uncomment once the office and VPN addresses are known. The portal holds guest
# data and integration credentials; there is no reason for it to answer the
# whole internet.
#
# <Location "/">
#     Require ip 197.0.0.0/24
#     Require ip 41.0.0.0/24
# </Location>
